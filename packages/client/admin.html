<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Bug Game — World Editor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #left-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #viewport {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      button {
        background: #3c8dbc;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }
      button:hover {
        background: #367fa9;
      }
      button.secondary {
        background: #3a3d42;
      }
      button.secondary:hover {
        background: #4a4d52;
      }
      button.danger {
        background: #b23c3c;
      }
      button.active {
        background: #3c8dbc;
        color: white;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Floating top-right toolbar (Open Editor / Undo,Redo,Save) */
      #top-toolbar {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        background: rgba(32, 34, 37, 0.85);
        padding: 8px;
        border-radius: 6px;
        backdrop-filter: blur(4px);
      }

      /* Panel for the currently-inspected item's properties (fixed corner, not tracking the item on screen) */
      #inspect-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        background: rgba(32, 34, 37, 0.9);
        padding: 8px;
        border-radius: 6px;
        white-space: nowrap;
        font-size: 12px;
        color: #e6e6e6;
      }
      #inspect-panel .inspect-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #inspect-panel button {
        font-size: 12px;
        padding: 5px 8px;
      }
      #inspect-panel input[type="number"] {
        width: 60px;
        background: #14161a;
        color: #e6e6e6;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 12px;
      }

      /* Toolbox row (Pony Town-style: one button per tool, always visible in edit mode) */
      #toolbox-row {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #202225;
        border-top: 1px solid #14161a;
      }
      #toolbox-row button {
        font-size: 12px;
        padding: 8px 10px;
      }

      #category-row {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: #202225;
        border-top: 1px solid #14161a;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      #category-row button {
        font-size: 12px;
        padding: 5px 10px;
        flex-shrink: 0;
      }

      #tray-row {
        flex-shrink: 0;
        height: 100px;
        background: #202225;
        border-top: 1px solid #14161a;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        box-sizing: border-box;
        color: #e6e6e6;
      }
      #search-items {
        width: 160px;
        flex-shrink: 0;
        background: #14161a;
        color: #e6e6e6;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 8px;
        font-size: 13px;
      }
      #item-tray {
        flex: 1;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        height: 84px;
        align-items: center;
        cursor: grab;
        scrollbar-width: thin;
      }
      #item-tray.dragging {
        cursor: grabbing;
      }
      #item-tray .empty-hint {
        color: #7a828a;
        font-size: 12px;
      }
      .tray-item {
        flex-shrink: 0;
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 4px;
        cursor: grab;
        border: 2px solid transparent;
      }
      .tray-item:hover {
        border-color: #3c8dbc;
      }

      #show-barriers-label {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #9aa0a6;
        cursor: pointer;
        white-space: nowrap;
      }

      #add-item-panel {
        width: 240px;
        flex-shrink: 0;
        background: #2d3035;
        color: #e6e6e6;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      #add-item-panel h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9aa0a6;
        margin: 0 0 12px;
      }
      #drop-zone {
        background: white;
        color: #333;
        border: 2px dashed #9aa0a6;
        border-radius: 6px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12px;
        padding: 8px;
        cursor: pointer;
        box-sizing: border-box;
      }
      #drop-zone.drag-over {
        border-color: #3c8dbc;
        background: #eef6fb;
      }
      #drop-zone img {
        max-width: 100%;
        max-height: 100%;
      }
      #add-item-panel input[type="text"],
      #add-item-panel select {
        width: 100%;
        box-sizing: border-box;
        background: #14161a;
        color: #e6e6e6;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 8px;
        font-size: 13px;
        margin-top: 12px;
      }
      #add-item-panel label.field-label {
        display: block;
        font-size: 11px;
        color: #9aa0a6;
        margin-top: 12px;
      }
      #add-item-panel label.field-label input,
      #add-item-panel label.field-label select {
        margin-top: 4px;
      }
      #add-item-panel button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
      }
      #upload-status {
        font-size: 12px;
        color: #9aa0a6;
        margin-top: 10px;
        min-height: 16px;
      }

      /* Save-slot picker modal */
      #slot-modal {
        position: absolute;
        inset: 0;
        background: rgba(10, 11, 13, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #slot-modal-inner {
        background: #202225;
        border-radius: 8px;
        padding: 16px;
        width: min(720px, 90vw);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        color: #e6e6e6;
      }
      #slot-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      #slot-modal-header h2 {
        font-size: 15px;
        margin: 0;
      }
      #slot-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        overflow-y: auto;
        padding: 2px;
      }
      .slot-card {
        background: #2d3035;
        border-radius: 6px;
        overflow: hidden;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .slot-card:hover {
        border-color: #3c8dbc;
      }
      .slot-card.current {
        border-color: #4caf7d;
      }
      .slot-card-thumb {
        width: 100%;
        height: 84px;
        background: #14161a;
        object-fit: cover;
        display: block;
      }
      .slot-card-body {
        padding: 8px;
      }
      .slot-card-name {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot-card-meta {
        font-size: 10px;
        color: #9aa0a6;
        margin-top: 2px;
      }
      .slot-card-actions {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .slot-card-actions button {
        font-size: 11px;
        padding: 4px 6px;
      }
      .slot-card.new-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
        color: #9aa0a6;
        font-size: 13px;
        border: 2px dashed #3a3d42;
        background: transparent;
      }
      .slot-card.new-slot:hover {
        border-color: #3c8dbc;
        color: #e6e6e6;
      }

      /* Property fields for the selected item, shown inside the selection toolbar area when expanded */
      #status-line {
        position: absolute;
        bottom: 8px;
        left: 12px;
        font-size: 12px;
        color: #e6e6e6;
        background: rgba(32, 34, 37, 0.85);
        padding: 4px 8px;
        border-radius: 4px;
      }

      #login-gate {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #14161a;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #login-gate p {
        color: #9aa0a6;
        max-width: 320px;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left-column">
        <div id="viewport">
          <canvas id="renderCanvas"></canvas>
          <div id="login-gate"></div>
          <div id="top-toolbar" class="hidden"></div>
          <div id="inspect-panel" class="hidden"></div>
          <div id="status-line" class="hidden"></div>
        </div>
        <div id="toolbox-row" class="hidden"></div>
        <div id="category-row" class="hidden"></div>
        <div id="tray-row" class="hidden">
          <input id="search-items" type="text" placeholder="Search items" />
          <button id="add-btn" class="secondary">Add</button>
          <div id="item-tray"></div>
          <label id="show-barriers-label">
            <input id="show-barriers-toggle" type="checkbox" />
            Show barriers
          </label>
        </div>
      </div>
      <div id="add-item-panel" class="hidden">
        <h2>Add New Item</h2>
        <div id="drop-zone">Drag image here, or click to upload</div>
        <input type="file" id="file-input" accept="image/*" class="hidden" />
        <input type="text" id="item-name" placeholder="Name item" />
        <label class="field-label">
          Category
          <input type="text" id="item-category" placeholder="e.g. Nature, Furniture" list="category-options" />
          <datalist id="category-options"></datalist>
        </label>
        <label class="field-label">
          Default layer
          <select id="item-default-layer">
            <option value="behind">Behind</option>
            <option value="auto" selected>Auto</option>
            <option value="front">Front</option>
          </select>
        </label>
        <button id="upload-btn">Upload</button>
        <div id="upload-status"></div>
      </div>
      <div id="slot-modal" class="hidden">
        <div id="slot-modal-inner">
          <div id="slot-modal-header">
            <h2>Load Map</h2>
            <button id="slot-modal-close" class="secondary">Close</button>
          </div>
          <div id="slot-list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
