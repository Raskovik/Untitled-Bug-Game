<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Bug Game — World Editor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #viewport {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #sidebar {
        width: 280px;
        flex-shrink: 0;
        background: #202225;
        color: #e6e6e6;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      #sidebar h1 {
        font-size: 16px;
        margin: 0 0 16px;
      }
      #sidebar h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9aa0a6;
        margin: 20px 0 8px;
      }
      #sidebar button, #sidebar select, #sidebar input[type="range"], #sidebar input[type="number"] {
        width: 100%;
        box-sizing: border-box;
      }
      #sidebar input[type="number"], #sidebar select {
        background: #14161a;
        color: #e6e6e6;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
      }
      button {
        background: #3c8dbc;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #367fa9;
      }
      button.secondary {
        background: #3a3d42;
      }
      button.secondary:hover {
        background: #4a4d52;
      }
      button.danger {
        background: #b23c3c;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary.active {
        background: #3c8dbc;
        color: white;
      }
      .action-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .action-row button {
        flex: 1;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #9aa0a6;
        margin-bottom: 4px;
      }
      #tool-hint {
        font-size: 11px;
        color: #7a828a;
        font-style: italic;
        margin: 4px 0 4px;
      }
      .thumb-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: #7a828a;
      }
      .thumb {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 4px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .thumb:hover {
        border-color: #3c8dbc;
      }
      #status {
        font-size: 12px;
        color: #9aa0a6;
        margin-top: 12px;
        min-height: 16px;
      }
      #login-gate {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #14161a;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #login-gate p {
        color: #9aa0a6;
        max-width: 320px;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <canvas id="renderCanvas"></canvas>
        <div id="login-gate"></div>
      </div>
      <div id="sidebar" class="hidden"></div>
    </div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
